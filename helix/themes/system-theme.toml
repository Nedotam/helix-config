# System theme — inherits all colors from the terminal palette.
# Syntax colors adapt automatically when you switch Kitty themes.
#
# See also: https://docs.helix-editor.com/themes.html
#
# NOTE: Keys default to the most specific parent value.
#       e.g ui.cursor.primary > ui.cursor > ui



# GENERAL ==============================

warning = { fg = "yellow" }
error = { fg = "red" }
info = { fg = "blue" }
hint = { fg = "cyan" }
diagnostic = { underline = { style = "curl", color = "red" } }

# UI ==============================
# For styling helix itself.

'ui.window' = { fg = "white" }
'ui.gutter' = { fg = "brightblack" }

'ui.text.focus' = { fg = "black", bg = "cyan" }

'ui.cursor' = { fg = "black", bg = "white" }
'ui.cursor.primary' = { fg = "black", bg = "white" }
'ui.cursor.insert' = { fg = "black", bg = "green" }
'ui.cursor.select' = { fg = "black", bg = "magenta" }
'ui.cursor.match' = { fg = "yellow", modifiers = ["bold"] }

'ui.selection' = { bg = "brightblack" }
'ui.selection.primary' = { fg = "white", bg = "blue" }

'ui.linenr' = { fg = "brightblack" }
'ui.linenr.selected' = { fg = "white" }

'ui.virtual.ruler' = { bg = "brightblack" }
'ui.virtual.whitespace' = { fg = "brightblack" }

'ui.statusline' = { fg = "white", bg = "brightblack" }
'ui.statusline.active' = { fg = "white", bg = "black" }
'ui.statusline.inactive' = { fg = "brightblack", bg = "black" }
"ui.statusline.normal" = { fg = "black", bg = "blue" }
"ui.statusline.insert" = { fg = "black", bg = "green" }
"ui.statusline.select" = { fg = "black", bg = "magenta" }

'ui.help' = { fg = "white", bg = "brightblack" }

'ui.highlight' = { fg = "black", bg = "cyan" }

'ui.menu' = { fg = "white", bg = "brightblack" }
'ui.menu.selected' = { fg = "white", bg = "blue" }

'ui.popup' = { bg = "brightblack" }
'ui.popup.info' = { bg = "brightblack" }


# SYNTAX HIGHLIGHTING ==============================

'property' = { fg = "blue" }
'special' = { fg = "magenta" }
'attribute' = { fg = "yellow" }

'type' = { fg = "cyan" }
'type.builtin' = { fg = "cyan" }
'type.enum.variant' = { fg = "cyan" }

'constructor' = { fg = "yellow" }

'constant' = { fg = "magenta" }
'constant.builtin' = { fg = "magenta" }
'constant.builtin.boolean' = { fg = "magenta" }
'constant.character' = { fg = "magenta" }
'constant.character.escape' = { fg = "brightmagenta" }
'constant.numeric' = { fg = "magenta" }
'constant.numeric.integer' = { fg = "magenta" }
'constant.numeric.float' = { fg = "magenta" }

'string' = { fg = "green" }
'string.regexp' = { fg = "red" }
'string.special' = { fg = "green" }
'string.special.path' = { fg = "green" }
'string.special.url' = { fg = "green", modifiers = ["underlined"] }
'string.special.symbol' = { fg = "green" }

'comment' = { fg = "brightblack" }
'comment.line' = { fg = "brightblack" }
'comment.block' = { fg = "brightblack" }
'comment.block.documentation' = { fg = "brightblack" }

'variable' = { }
'variable.builtin' = { fg = "red" }
'variable.parameter' = { fg = "red" }
'variable.other.member' = { fg = "blue" }

'label' = { fg = "yellow" }

'punctuation' = { fg = "white" }
'punctuation.delimiter' = { fg = "white" }
'punctuation.bracket' = { fg = "white" }

'keyword' = { fg = "red" }
'keyword.control' = { fg = "red" }
'keyword.control.conditional' = { fg = "red" }
'keyword.control.repeat' = { fg = "red" }
'keyword.control.import' = { fg = "red" }
'keyword.control.return' = { fg = "red" }
'keyword.control.exception' = { fg = "red" }
'keyword.operator' = { fg = "red" }
'keyword.directive' = { fg = "red" }
'keyword.function' = { fg = "red" }

'operator' = { fg = "red" }

'function' = { fg = "blue" }
'function.builtin' = { fg = "blue" }
'function.method' = { fg = "blue" }
'function.macro' = { fg = "red" }
'function.special' = { fg = "blue" }

'tag' = { fg = "red" }
'tag.error' = { fg = "red", modifiers = ["bold"] }

'namespace' = { fg = "yellow" }


# Markup ==============================

'markup.heading.1' = { fg = "red", modifiers = ["bold"] }
'markup.heading.2' = { fg = "red", modifiers = ["bold"] }
'markup.heading.3' = { fg = "red", modifiers = ["bold"] }
'markup.heading.4' = { fg = "red", modifiers = ["bold"] }
'markup.heading.5' = { fg = "red", modifiers = ["bold"] }
'markup.heading.6' = { fg = "red", modifiers = ["bold"] }
'markup.heading.marker' = { fg = "brightblack" }

'markup.list' = { fg = "red" }
'markup.list.numbered' = { fg = "red" }
'markup.list.unnumbered' = { fg = "red" }

'markup.bold' = { modifiers = ["bold"] }
'markup.italic' = { modifiers = ["italic"] }

'markup.link' = { fg = "cyan" }
'markup.link.url' = { fg = "cyan", modifiers = ["underlined"] }
'markup.link.label' = { fg = "cyan" }
'markup.link.text' = { fg = "cyan" }

'markup.quote' = { fg = "brightblack" }


# Markup - Interface ==============================

'markup.heading.completion' = { fg = "yellow" }
'markup.heading.raw' = { fg = "yellow" }

'markup.raw' = { fg = "green" }
'markup.raw.block' = { fg = "green" }
'markup.raw.inline' = { fg = "green" }
'markup.raw.inline.completion' = { fg = "green" }
'markup.raw.inline.hover' = { fg = "green" }


# Diff ==============================

'diff.plus' = { fg = "green" }
'diff.minus' = { fg = "red" }
'diff.delta' = { fg = "yellow" }
'diff.delta.moved' = { fg = "yellow" }


